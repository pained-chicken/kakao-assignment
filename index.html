<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 앱 전체를 감싸는 컨테이너 -->
  <main class="app">
    <!-- 헤더 영역: 앱 제목 -->
    <header class="app__header">
      <h1 class="app__title">할 일 목록</h1>

      <!-- 일간 뷰: 이전/다음 버튼으로 날짜를 이동하고 현재 날짜를 표시한다 -->
      <div class="date-nav">
        <button type="button" id="prev-day" class="date-nav__button" aria-label="이전 날짜">‹</button>
        <span id="current-date" class="date-nav__label"></span>
        <button type="button" id="next-day" class="date-nav__button" aria-label="다음 날짜">›</button>
      </div>
    </header>

    <!-- 입력 영역: Todo 생성 폼 -->
    <!-- form으로 감싸 Enter 키 입력으로도 추가가 가능하도록 함 -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-form__input"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
      />
      <button type="submit" class="todo-form__button">추가</button>
    </form>

    <!-- 안내 메시지 영역: 빈 입력 등 사용자 피드백을 표시 -->
    <p id="form-message" class="form-message"></p>

    <!-- 상태별 필터 탭: 전체 / 진행 전 / 진행 중 / 완료 -->
    <!-- 각 버튼의 data-filter 값으로 어떤 상태를 보여줄지 구분한다 -->
    <div id="todo-filters" class="todo-filters">
      <button type="button" class="todo-filters__button is-active" data-filter="all">전체</button>
      <button type="button" class="todo-filters__button" data-filter="none">진행 전</button>
      <button type="button" class="todo-filters__button" data-filter="active">진행 중</button>
      <button type="button" class="todo-filters__button" data-filter="completed">완료</button>
    </div>

    <!-- Todo 항목들이 동적으로 렌더링되는 목록 영역 -->
    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
